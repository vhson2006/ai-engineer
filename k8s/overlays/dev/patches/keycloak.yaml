# Tokens get iss = http://auth.localtest.me:8000/realms/<realm> (the public URL through the Gateway).
# The admin console uses its own URL, reachable only through `npm run k8s:forward`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  template:
    spec:
      containers:
        - name: keycloak
          env:
            - name: KC_HOSTNAME
              value: http://auth.localtest.me:8000
            - name: KC_HOSTNAME_ADMIN
              value: http://localhost:8180
