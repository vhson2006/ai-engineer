# DEV ONLY credentials. Never commit real passwords: in other environments create these
# Secrets out of band (or with a secret manager).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
type: Opaque
stringData:
  # Bootstrap admin of the "master" realm (Admin Console login).
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: admin
---
# Keycloak's own database user. The init container creates the role and the "keycloak"
# database in the shared Postgres if they don't exist yet.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db
type: Opaque
stringData:
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: keycloak
---
# The client secrets the Job keycloak-config sets in Keycloak (ADR 0043); the apps use the same
# values (their .env / env files).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-clients
type: Opaque
stringData:
  WEB_CLIENT_SECRET: web-dev-secret
  ADMIN_WEB_CLIENT_SECRET: admin-web-dev-secret
  LAUNDRY_WEB_CLIENT_SECRET: laundry-web-dev-secret
  SUSHI_WEB_CLIENT_SECRET: sushi-web-dev-secret
  TRAVEL_WEB_CLIENT_SECRET: travel-web-dev-secret
  FLOWERS_WEB_CLIENT_SECRET: flowers-web-dev-secret
  AUTOPARTS_WEB_CLIENT_SECRET: autoparts-web-dev-secret
  HOTEL_WEB_CLIENT_SECRET: hotel-web-dev-secret
  SPA_WEB_CLIENT_SECRET: spa-web-dev-secret
  NAILS_WEB_CLIENT_SECRET: nails-web-dev-secret
  WINE_WEB_CLIENT_SECRET: wine-web-dev-secret
---
# The customers' realms' e-mail and Google sign-in (ADR 0050), read by the Job keycloak-config.
# Mail goes to Mailpit (components/mailpit: any user and password). Google is off: to try it, put
# GOOGLE_SIGN_IN=true and your Google client in k8s/.keycloak-local.env (k8s/keycloak-local.env.example).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-customer-auth
type: Opaque
stringData:
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SMTP_FROM: no-reply@localtest.me
  SMTP_USER: keycloak
  SMTP_PASSWORD: mailpit-accepts-any
  GOOGLE_SIGN_IN: 'false'
  GOOGLE_CLIENT_ID: not-configured
  GOOGLE_CLIENT_SECRET: not-configured
  # Client "unverified-cleanup" of each site realm: the CronJob that deletes accounts never activated.
  UNVERIFIED_CLEANUP_CLIENT_SECRET: unverified-cleanup-dev-secret
