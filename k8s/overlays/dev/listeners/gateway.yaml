# Dev host names: *.localtest.me is public DNS that resolves to 127.0.0.1 (no hosts-file edits).
# Port 8000 because Windows' HTTP.sys usually holds port 80. Docker Desktop publishes the
# LoadBalancer port on localhost.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
spec:
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: edge-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      hostname: '*.set-by-public-urls.invalid' # components/public-urls: WILDCARD_HOST
      allowedRoutes:
        namespaces:
          from: Same
