# Keycloak like prod: production mode `start` (strict hostname, no dev defaults), behind the
# Gateway's TLS. Tokens get iss = <AUTH_URL of urls.env>/realms/<realm>.
# Admin console (never published): kubectl -n nest-staging port-forward svc/keycloak 8181:8080
# → http://localhost:8181/admin. Host names: urls.env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  template:
    spec:
      containers:
        - name: keycloak
          args: ['start']
