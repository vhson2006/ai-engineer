# Keycloak like prod: production mode `start` (strict hostname, no dev defaults), behind the
# Gateway's TLS. Tokens get iss = https://auth.staging.localtest.me/realms/<realm>.
# Admin console (never published): kubectl -n nest-staging port-forward svc/keycloak 8181:8080
# → http://localhost:8181/admin (realm master's Frontend URL: npm run staging:up sets it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  template:
    spec:
      containers:
        - name: keycloak
          args: ['start', '--import-realm']
          env:
            - name: KC_HOSTNAME
              value: https://auth.staging.localtest.me
            - name: KC_HOSTNAME_ADMIN
              value: http://localhost:8181
