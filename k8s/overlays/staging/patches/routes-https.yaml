# Same as overlays/prod/patches/routes-https.yaml (kustomize can't load files from another
# overlay): the www, admin and auth routes attach to the https listener only (plain HTTP just redirects,
# gateway/https-redirect.yaml), with HSTS.
- op: add
  path: /spec/parentRefs/0/sectionName
  value: https
- op: add
  path: /spec/rules/0/filters
  value:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
          - name: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
