# Plain HTTP only redirects: http://*.staging.localtest.me:8001 → https (301), like prod.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - name: edge
      sectionName: http
  hostnames:
    - '*.set-by-public-urls.invalid' # components/public-urls-tls: WILDCARD_HOST
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
