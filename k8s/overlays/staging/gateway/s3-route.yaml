# Object storage for browsers (presigned uploads/downloads), like a cloud bucket endpoint in prod:
# https://s3.staging.localtest.me → SeaweedFS. deployment-service uses the same URL (through the
# CoreDNS rule), so the presigned URLs it signs are valid for the browser.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: s3
spec:
  parentRefs:
    - name: edge
      sectionName: https
  hostnames:
    - s3.staging.localtest.me
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: seaweedfs
          port: 8333
