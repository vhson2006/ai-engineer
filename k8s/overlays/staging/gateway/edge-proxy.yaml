# Data plane of the staging Gateway: one nginx replica (NGF creates Service "edge-nginx" in this
# namespace; in-cluster clients reach https://*.staging.localtest.me through it, see the CoreDNS
# rule installed by `npm run staging:up`).
apiVersion: gateway.nginx.org/v1alpha2
kind: NginxProxy
metadata:
  name: edge-proxy
spec:
  kubernetes:
    deployment:
      replicas: 1
    service:
      # Cluster, not NGF's default Local: Docker Desktop's cluster has several nodes and its load
      # balancer may send to any of them; with Local only the node running nginx answers, so most
      # requests hang (seen after a cluster restart, 2026-11-09). Costs the client IP (fine here);
      # prod keeps Local (cloud LB health-checks nodes, real client IPs).
      externalTrafficPolicy: Cluster
