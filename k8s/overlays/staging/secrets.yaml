# LOCAL STAGING ONLY. Plain dev credentials (the same as the dev overlay / docker-compose), so the
# local cluster needs no secret manager. Production gets these Secrets from the secret manager
# through External Secrets (overlays/prod/secrets); none of these values is ever valid there.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: admin
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db
type: Opaque
stringData:
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: keycloak
---
apiVersion: v1
kind: Secret
metadata:
  name: deployment-db
type: Opaque
stringData:
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_NAME: deployment
---
