# The apps reference this pull secret (prod: GHCR). Local images are loaded into the nodes and
# never pulled, so an empty registry config is enough.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{}}'
---
# The client secrets the Job keycloak-config sets in Keycloak (ADR 0043); the apps use the same
# values (their .env / env files).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-clients
type: Opaque
stringData:
  WEB_CLIENT_SECRET: web-dev-secret
  ADMIN_WEB_CLIENT_SECRET: admin-web-dev-secret
