# TLS terminated at the Gateway with a wildcard certificate for WILDCARD_HOST (urls.env).
# cert-manager (Gateway API support enabled) sees the annotation, creates a Certificate for the
# https listener's hostname and stores it in the Secret named in certificateRefs; it renews it
# before expiry. ClusterIssuer: k8s/platform/prod/cluster-issuers.yaml (DNS-01, DigitalOcean DNS).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: edge-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: '*.set-by-public-urls.invalid' # components/public-urls: WILDCARD_HOST
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: '*.set-by-public-urls.invalid' # components/public-urls: WILDCARD_HOST
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: Same
