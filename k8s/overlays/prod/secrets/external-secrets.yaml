---
# Image pull Secret for the private GHCR images (referenced by every app Deployment).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: prod-secrets
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: nest-microservice-prod-ghcr
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: prod-secrets
  target:
    name: grafana-cloud
  dataFrom:
    - extract:
        key: nest-microservice-prod-grafana-cloud
