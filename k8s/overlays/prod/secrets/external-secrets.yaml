# The client secrets the Job keycloak-config writes into Keycloak (ADR 0043): the SAME entries the
# web apps read, so Keycloak and the apps can't disagree and nothing is copied by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-clients
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: prod-secrets
  target:
    name: keycloak-clients
  data:
    - secretKey: WEB_CLIENT_SECRET
      remoteRef:
        key: nest-microservice-prod-portfolio-web
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: ADMIN_WEB_CLIENT_SECRET
      remoteRef:
        key: nest-microservice-prod-admin-web
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: AUTOPARTS_WEB_CLIENT_SECRET
      remoteRef:
        key: nest-microservice-prod-autoparts-web
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: FLOWERS_WEB_CLIENT_SECRET
      remoteRef:
        key: nest-microservice-prod-flowers-web
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: HOTEL_WEB_CLIENT_SECRET
      remoteRef:
        key: nest-microservice-prod-hotel-web
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: LAUNDRY_WEB_CLIENT_SECRET
      remoteRef:
        key: nest-microservice-prod-laundry-web
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: NAILS_WEB_CLIENT_SECRET
      remoteRef:
        key: nest-microservice-prod-nails-web
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: SPA_WEB_CLIENT_SECRET
      remoteRef:
        key: nest-microservice-prod-spa-web
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: SUSHI_WEB_CLIENT_SECRET
      remoteRef:
        key: nest-microservice-prod-sushi-web
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: TRAVEL_WEB_CLIENT_SECRET
      remoteRef:
        key: nest-microservice-prod-travel-web
        property: KEYCLOAK_CLIENT_SECRET
    - secretKey: WINE_WEB_CLIENT_SECRET
      remoteRef:
        key: nest-microservice-prod-wine-web
        property: KEYCLOAK_CLIENT_SECRET
---
# Image pull Secret for the private GHCR images (referenced by every app Deployment).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: prod-secrets
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  dataFrom:
    - extract:
        key: nest-microservice-prod-ghcr
---
