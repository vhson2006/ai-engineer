# Production Secrets are NEVER in git. External Secrets Operator (ESO) copies them from the secret
# manager behind the ClusterSecretStore "prod-secrets" (k8s/platform/prod), refreshes them hourly,
# and owns the resulting Kubernetes Secrets (deleted with the ExternalSecret).
#
# Each ExternalSecret reads ONE entry of the secret manager whose fields become the Secret's keys
# (dataFrom.extract). Create these entries with exactly these field names:
#
#   nest-microservice-prod-keycloak-admin   KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD
#   nest-microservice-prod-keycloak-db      KC_DB_USERNAME, KC_DB_PASSWORD,
#                                           KC_DB_URL = jdbc:postgresql://<host>:<port>/keycloak?sslmode=verify-full&sslrootcert=/etc/db-ca/ca.crt
#   nest-microservice-prod-deployment-db    DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME (deployment), DB_SSLMODE=require
#   nest-microservice-prod-notification-db  NOTIFICATION_DB_HOST, _PORT, _USER, _PASSWORD, NOTIFICATION_DB_NAME (notification),
#                                           NOTIFICATION_DB_SSLMODE=require
#   nest-microservice-prod-ai-db            AI_DB_HOST, _PORT, _USER, _PASSWORD, AI_DB_NAME (ai), AI_DB_SSLMODE=require
#   nest-microservice-prod-ai-providers     GEMINI_API_KEY (Google AI Studio; ADR 0036)
#   nest-microservice-prod-db-ca            ca.crt  (the managed Postgres CA certificate, PEM)
#   nest-microservice-prod-storage          STORAGE_ACCESS_KEY_ID, STORAGE_SECRET_ACCESS_KEY  (a Spaces key
#                                           limited to the two buckets, read/write)
#   nest-microservice-prod-portfolio-web    KEYCLOAK_CLIENT_SECRET, SESSION_ENCRYPTION_KEY (32 random bytes, base64url),
#                                           REDIS_URL = rediss://<user>:<password>@<host>:<port>
#   nest-microservice-prod-admin-web        same keys, its OWN values: client secret of "admin-web", another
#                                           SESSION_ENCRYPTION_KEY, REDIS_URL of the Valkey user admin-web
#                                           (keys admin-web:* only, k8s/README.md#production)
#   nest-microservice-prod-ghcr             username, token  (GitHub user + PAT with read:packages)
#   nest-microservice-prod-grafana-cloud    GRAFANA_CLOUD_* (k8s/grafana-cloud.env.example; token write-only:
#                                           metrics:write, logs:write, traces:write)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: prod-secrets
  target:
    name: keycloak-admin
  dataFrom:
    - extract:
        key: nest-microservice-prod-keycloak-admin
---
