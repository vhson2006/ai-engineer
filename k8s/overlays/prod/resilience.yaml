# Voluntary disruptions (node upgrades, drains, autoscaler) may never take the last replica.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: krakend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: krakend
