# TLS terminated at the Gateway with a wildcard certificate for *.example.com.
# cert-manager (Gateway API support enabled) sees the annotation, creates a Certificate for the
# https listener's hostname and stores it in the Secret named in certificateRefs; it renews it
# before expiry. ClusterIssuer: k8s/platform/prod/cluster-issuers.yaml (DNS-01, DigitalOcean DNS).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  infrastructure:
    parametersRef:
      group: gateway.nginx.org
      kind: NginxProxy
      name: edge-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: '*.example.com'
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: '*.example.com'
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-example-com-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
spec:
  hostnames:
    - auth.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www
spec:
  hostnames:
    - www.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
spec:
  hostnames:
    - admin.example.com
