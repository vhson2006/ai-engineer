# Applied to the www, admin and auth routes (see kustomization.yaml):
#  - attach them to the https listener only (plain HTTP just redirects, gateway/edge.yaml);
#  - add HSTS so browsers never try plain HTTP again for a year.
- op: add
  path: /spec/parentRefs/0/sectionName
  value: https
- op: add
  path: /spec/rules/0/filters
  value:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
          - name: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
