# Production on DigitalOcean Kubernetes (DOKS), deployed by Argo CD (never `kubectl apply` by hand:
# the migration Job is an Argo CD PreSync hook). Bootstrap and checklist: k8s/README.md#production.
#
#   https://www.example.com   portfolio-web
#   https://admin.example.com admin-web (admins only: client role + password + one-time code, ADR 0019)
#   https://auth.example.com  Keycloak (app realm only; admin console via port-forward)
#   KrakenD and the services are NOT public: only the web apps' servers call KrakenD (in cluster).
#
# Replace example.com everywhere in this folder with the real domain (and set the repository
# variable PROD_DOMAIN for the web images).
# Data: DigitalOcean managed Postgres (databases "deployment", "notification", "content", "ai" and "keycloak") and managed Valkey;
# NATS runs in the cluster. Secrets come from the secret manager through External Secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nest-microservice

labels:
  - pairs:
      app.kubernetes.io/part-of: nest-microservice
    includeSelectors: false

resources:
  - ../../base
  - secrets/external-secrets.yaml
  - gateway/edge.yaml
  - resilience.yaml
  - migration-job.yaml

components:
  - listeners # this environment's Gateway listeners (before public-urls)
  - ../../components/public-urls # urls.env -> Gateway, routes, apps' settings
  - ../../components/nats
  - ../../components/apps
  - ../../components/network-policies
  - ../../components/observability # Alloy → Grafana Cloud (ADR 0023)
  - ../../components/https # LAST: https-only routes + HSTS (urls.env), https listener host

# The images: k8s/images.json (the one list; CI checks this block against it). .github/workflows/
# images.yml sets each newTag to the commit SHA it built and commits; Argo CD syncs.
# Images are private (GHCR, like the repository): pods pull them with the Secret "ghcr-pull".
images:
  - name: deployment-service
    newName: ghcr.io/vhson2006/ai-engineer/deployment-service
    newTag: 7e619f823f7fcaff8c296a506a1332c4443ddeac
  - name: notification-service
    newName: ghcr.io/vhson2006/ai-engineer/notification-service
    newTag: 7e619f823f7fcaff8c296a506a1332c4443ddeac
  - name: content-service
    newName: ghcr.io/vhson2006/ai-engineer/content-service
    newTag: 7e619f823f7fcaff8c296a506a1332c4443ddeac
  - name: ai-service
    newName: ghcr.io/vhson2006/ai-engineer/ai-service
    newTag: 7e619f823f7fcaff8c296a506a1332c4443ddeac
  - name: deployment-migrate
    newName: ghcr.io/vhson2006/ai-engineer/deployment-migrate
    newTag: 7e619f823f7fcaff8c296a506a1332c4443ddeac
  - name: render-worker
    newName: ghcr.io/vhson2006/ai-engineer/render-worker
    newTag: 918f3e2e5928928d4a71218ad8b9087ae6bcc89d
  - name: portfolio-web
    newName: ghcr.io/vhson2006/ai-engineer/portfolio-web
    newTag: 7e619f823f7fcaff8c296a506a1332c4443ddeac
  - name: admin-web
    newName: ghcr.io/vhson2006/ai-engineer/admin-web
    newTag: 7e619f823f7fcaff8c296a506a1332c4443ddeac

configMapGenerator:
  - name: public-urls # this environment's public addresses: urls.env (components/public-urls)
    envs:
      - urls.env
  - name: krakend-settings
    files:
      - krakend/settings/env.json
  - name: keycloak-config # + the master client the Job signs in with (ADR 0043); no test users, no dev-cli
    behavior: merge
    files:
      - keycloak/master-config-cli.json
  - name: deployment-service-env
    envs:
      - env/deployment-service.env
  - name: notification-service-env
    envs:
      - env/notification-service.env
  - name: content-service-env
    envs:
      - env/content-service.env
  - name: ai-service-env
    envs:
      - env/ai-service.env
  - name: render-worker-env
    envs:
      - env/render-worker.env
  - name: portfolio-web-env
    envs:
      - env/portfolio-web.env
  - name: admin-web-env
    envs:
      - env/admin-web.env
  - name: alloy-env
    literals:
      - CLUSTER_NAME=prod

patches:
  - path: patches/keycloak.yaml # production mode, 2 replicas, managed DB over TLS
  - target: # managed Postgres: the database and user are created once, by hand (README)
      kind: Deployment
      name: keycloak
    patch: |-
      - op: remove
        path: /spec/template/spec/initContainers
  - path: patches/replicas.yaml
  - path: patches/spread.yaml
    target:
      kind: Deployment
