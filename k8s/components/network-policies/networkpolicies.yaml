# Zero trust inside the namespace: nothing may connect to a pod unless a rule below allows it.
# Allowed flows (everything else is dropped):
#
#   Internet ─▶ edge-nginx :80/:443
#   edge-nginx ─▶ portfolio-web :3000, admin-web :3000, business sites :3000, keycloak :8080
#                 (KrakenD is NOT reachable from the edge)
#   portfolio-web, admin-web, business sites ─▶ krakend :8080  (server-side API calls; tokens never
#                 leave the server). Business sites: every pod labelled role=business-site (k8s/sites).
#   krakend ─▶ deployment-service :3001, content-service :3003
#   krakend, deployment-service, content-service ─▶ keycloak :8080   (JWKS)
#   keycloak-config (Job) ─▶ keycloak :8080   (applies the realms, ADR 0043)
#   keycloak ◀─▶ keycloak (all ports)         (cluster cache between replicas)
#   deployment-service, notification-service, content-service, ai-service, render-worker, nats-setup,
#   content-import (Jobs) ─▶ nats :4222
#
# Egress is not restricted here (managed Postgres/Valkey, DNS, Let's Encrypt are outside the
# cluster). Probes come from the kubelet on the node and are not affected on DOKS (Cilium).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ['Ingress']
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-from-internet
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: edge
  policyTypes: ['Ingress']
  ingress:
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portfolio-web-from-edge
spec:
  podSelector:
    matchLabels:
      app: portfolio-web
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: edge
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: admin-web-from-edge
spec:
  podSelector:
    matchLabels:
      app: admin-web
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: edge
      ports:
        - port: 3000
          protocol: TCP
---
# Every business site (k8s/sites/_template), by its label: a new site needs no rule of its own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: business-sites-from-edge
spec:
  podSelector:
    matchLabels:
      role: business-site
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: edge
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: krakend-from-web
spec:
  podSelector:
    matchLabels:
      app: krakend
  policyTypes: ['Ingress']
  ingress:
    # The API is private: only the web apps' servers. Even if an api.<domain> route were added
    # to the Gateway by mistake, nginx couldn't reach KrakenD.
    - from:
        - podSelector:
            matchLabels:
              app: portfolio-web
        - podSelector:
            matchLabels:
              app: admin-web
        - podSelector:
            matchLabels:
              role: business-site # their own service accounts: published articles only (ADR 0032)
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deployment-service-from-krakend
spec:
  podSelector:
    matchLabels:
      app: deployment-service
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: krakend
      ports:
        - port: 3001
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: content-service-from-krakend
spec:
  podSelector:
    matchLabels:
      app: content-service
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: krakend
      ports:
        - port: 3003
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-ingress
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: edge
        - podSelector:
            matchLabels:
              app: krakend
        - podSelector:
            matchLabels:
              app: deployment-service
        - podSelector:
            matchLabels:
              app: content-service
        - podSelector:
            matchLabels:
              app: keycloak-config # Job: applies the realms (ADR 0043)
      ports:
        - port: 8080
          protocol: TCP
    - from: # replicas form one cache cluster (JGroups)
        - podSelector:
            matchLabels:
              app: keycloak
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-from-services
spec:
  podSelector:
    matchLabels:
      app: nats
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: deployment-service
        - podSelector:
            matchLabels:
              app: notification-service
        - podSelector:
            matchLabels:
              app: content-service
        - podSelector:
            matchLabels:
              app: ai-service
        - podSelector:
            matchLabels:
              app: render-worker # video studio renders (ADR 0039)
        - podSelector:
            matchLabels:
              app: nats-setup # Job: creates the streams (ADR 0024)
        - podSelector:
            matchLabels:
              app: content-import # Job: publishes the imported articles' events (ADR 0044)
      ports:
        - port: 4222
          protocol: TCP
