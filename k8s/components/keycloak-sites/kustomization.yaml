# The business sites' Keycloak clients (<site>-web, confidential, client credentials) and their
# service accounts in group /sites/<id> with content:read (ADRs 0032, 0042): what each site's
# server reads its articles with. In an environment where the sites run: its Secret
# "keycloak-clients" then holds <SITE>_WEB_CLIENT_SECRET for each. Applied by Job keycloak-config.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: keycloak-config
    behavior: merge
    files:
      - sites.json
