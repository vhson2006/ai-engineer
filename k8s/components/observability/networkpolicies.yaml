# Flows of the telemetry agent, on top of the default deny (components/network-policies):
#
#   deployment-service, notification-service ─▶ alloy :4318      (OTLP traces)
#   alloy ─▶ deployment-service :3001, notification-service :3002 (GET /metrics)
#
# Alloy's egress (API server, Grafana Cloud over HTTPS) isn't restricted, like every other pod.
# A new instrumented app (KrakenD, the web apps) is added to BOTH rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-from-apps
spec:
  podSelector:
    matchLabels:
      app: alloy
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: deployment-service
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - port: 4318
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-alloy
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ['deployment-service', 'notification-service']
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: alloy
      ports:
        - port: 3001
          protocol: TCP
        - port: 3002
          protocol: TCP
