# KrakenD: the only HTTP entry to the services, PRIVATE (no Gateway route; only the web apps'
# servers call it). Stateless, so replicas can be scaled freely.
# Flexible Configuration, rendered at startup from three ConfigMaps (all hash-suffixed, so any
# change + `npm run k8s:up` rolls the pods):
#   /etc/krakend/config     krakend.tmpl                 (base: the endpoints)
#   /etc/krakend/templates  endpoint.tmpl, ...           (base: reusable blocks)
#   /etc/krakend/settings   env.json                     (overlay: issuer, JWKS, backends)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krakend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: krakend
  template:
    metadata:
      labels:
        app: krakend
    spec:
      # Otherwise Kubernetes injects KRAKEND_PORT=tcp://<ip>:8080 (from the "krakend" Service),
      # and KrakenD reads KRAKEND_* env vars as config overrides -> "cannot parse 'port'".
      enableServiceLinks: false
      containers:
        - name: krakend
          image: krakend:2.10.2
          args: ['run', '-c', '/etc/krakend/config/krakend.tmpl']
          env:
            - name: FC_ENABLE
              value: '1'
            - name: FC_SETTINGS
              value: /etc/krakend/settings
            - name: FC_TEMPLATES
              value: /etc/krakend/templates
            # The tokens' issuer (Keycloak's public URL): the environment's urls.env.
            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: public-urls
                  key: KEYCLOAK_ISSUER
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/krakend/config
              readOnly: true
            - name: templates
              mountPath: /etc/krakend/templates
              readOnly: true
            - name: settings
              mountPath: /etc/krakend/settings
              readOnly: true
            # Flexible Configuration renders the template to a temp file first; the root
            # filesystem stays read-only.
            - name: tmp
              mountPath: /tmp
          # /__health is KrakenD's own health; it does not call the backends.
          readinessProbe:
            httpGet:
              path: /__health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /__health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000 # the image's "krakend" user (the image itself defaults to root)
            runAsGroup: 65533
      volumes:
        - name: config
          configMap:
            name: krakend-config
        - name: templates
          configMap:
            name: krakend-templates
        - name: settings
          configMap:
            name: krakend-settings # generated by the overlay
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
