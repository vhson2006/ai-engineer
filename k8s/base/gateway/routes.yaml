# Host-based routes on the "edge" Gateway (gateway.yaml). Anything that matches no rule gets 404
# from nginx, so only what is listed here is reachable from outside the cluster.
# Host names: overlays/<env>/urls.env, written in by components/public-urls.
#
# KrakenD has NO route on purpose: the API is private. Only the web apps' servers call it, inside
# the cluster (prod NetworkPolicy krakend-from-web). Never add an api.<domain> route here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
spec:
  parentRefs:
    - name: edge
  hostnames:
    - auth.set-by-public-urls.invalid # components/public-urls: AUTH_HOST
  rules:
    # Keycloak's recommended public paths, narrowed to OUR realms: login pages, token, certs (JWKS),
    # logout, userinfo, account. nest-microservice (staff, the apps) here; each business site's
    # customers' realm /realms/site-<id> is added by its component (k8s/sites/<id>/keycloak, ADR
    # 0049): PathPrefix matches whole path segments, so "/realms/site-" would match none of them.
    # /admin, /realms/master, /metrics and /health stay private.
    - matches:
        - path: { type: PathPrefix, value: /realms/nest-microservice }
        - path: { type: PathPrefix, value: /resources }
      backendRefs:
        - name: keycloak
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www
spec:
  parentRefs:
    - name: edge
  hostnames:
    - www.set-by-public-urls.invalid # components/public-urls: WEB_HOST
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: portfolio-web
          port: 3000
---
# The admin site (ADR 0019): public host, but only administrators can sign in (client "admin-web":
# role admin-web:admin + password AND one-time code, short sessions). Never indexed (X-Robots-Tag).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
spec:
  parentRefs:
    - name: edge
  hostnames:
    - admin.set-by-public-urls.invalid # components/public-urls: ADMIN_HOST
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: admin-web
          port: 3000
