# Overrides of Keycloak's English e-mails (ADR 0050); every other text is Keycloak's.
# {0} link, {2} the site's name (realm display name), {3} how long the link is valid.

# Activation: the warning FIRST. Someone who registers another person's address gets that account
# only if its owner clicks this link (an accepted risk, ADR 0050): tell them not to.
emailVerificationBody=An account was created at {2} with this e-mail address.\n\nDidn''t create it? Do NOT click the link below: someone may be trying to use your address. Just delete this e-mail.\n\nIf it was you, activate your account:\n\n{0}\n\nThis link expires within {3}.
emailVerificationBodyHtml=<p>An account was created at <b>{2}</b> with this e-mail address.</p><p><b>Didn''t create it? Do NOT click the link below</b>: someone may be trying to use your address. Just delete this e-mail.</p><p>If it was you, activate your account:</p><p><a href="{0}">Activate my account</a></p><p>This link expires within {3}.</p>

# Password reset: an account not activated yet gets its activation e-mail right after.
passwordResetBody=Someone asked to reset the password of your {2} account. If it was you, choose a new password here:\n\n{0}\n\nThis link expires within {3}.\n\nIf your account isn''t activated yet, you''ll receive one more e-mail to activate it.\n\nDidn''t ask for it? Ignore this e-mail: nothing changes.
passwordResetBodyHtml=<p>Someone asked to reset the password of your <b>{2}</b> account. If it was you, choose a new password here:</p><p><a href="{0}">Choose a new password</a></p><p>This link expires within {3}.</p><p>If your account isn''t activated yet, you''ll receive one more e-mail to activate it.</p><p>Didn''t ask for it? Ignore this e-mail: nothing changes.</p>
