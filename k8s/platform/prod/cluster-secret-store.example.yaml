# EXAMPLE, not applied by kustomization.yaml: the store depends on the secret manager you pick,
# and its own credential is the one secret that must be created by hand, once:
#   kubectl -n external-secrets create secret generic doppler-token --from-literal=token=<service token>
#
# Every ExternalSecret in this repo uses ClusterSecretStore "prod-secrets" and reads entries by
# name with dataFrom.extract, so any provider with key/value entries works (Doppler, Infisical,
# 1Password, Vault, AWS Secrets Manager, GCP Secret Manager...). Doppler shown here:
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: prod-secrets
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token
            key: token
            namespace: external-secrets
