# Let's Encrypt issuers for the whole cluster. DNS-01 through the DigitalOcean DNS API: works for
# wildcard certificates (*.example.com) and needs no HTTP route. The DigitalOcean token (scope:
# domain read/write) comes from the secret manager (digitalocean-dns.yaml).
#
# Try letsencrypt-staging first (high rate limits, untrusted certificates): set it in the Gateway
# annotation (overlays/prod/patches/gateway.yaml), check `kubectl get certificate -A`, then switch
# to letsencrypt-prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@example.com # expiry warnings from Let's Encrypt: use a team mailbox
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: digitalocean-dns
              key: access-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: digitalocean-dns
              key: access-token
