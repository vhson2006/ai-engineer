# What every business site runs (ADRs 0042, 0045): one Deployment, its Service and its public
# route, built from web/Dockerfile. A Component used by k8s/sites/<id>/app, whose ConfigMap "site"
# (local, never deployed) names the app (APP = <id>-web) and its client secret's key; the rules below
# write them in. Everything else is the same for every site:
#   - ConfigMap "business-sites-env" of the overlay: API_URL, KEYCLOAK_ISSUER, STORAGE_ORIGINS
#   - Secret "keycloak-clients" of the overlay: the site's KEYCLOAK_CLIENT_SECRET (ADR 0043)
#   - label role=business-site: the NetworkPolicies (components/network-policies) and the
#     environment's patches (e.g. staging's local CA) select every site by it.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - site.yaml

replacements:
  # Order matters: the rules select the resources by their template name ("site"), so the
  # renaming rule comes last.
  - source: { kind: ConfigMap, name: site, fieldPath: data.CLIENT_SECRET_KEY }
    targets:
      - select: { kind: Deployment, name: site }
        fieldPaths:
          - spec.template.spec.containers.[name=web].env.[name=KEYCLOAK_CLIENT_SECRET].valueFrom.secretKeyRef.key
  - source: { kind: ConfigMap, name: site, fieldPath: data.APP }
    targets:
      # The path that holds the app's name: /app/apps/<app>/.next/cache
      - select: { kind: Deployment, name: site }
        fieldPaths:
          - spec.template.spec.containers.[name=web].volumeMounts.[name=next-cache].mountPath
        options: { delimiter: '/', index: 3 }
      - select: { kind: Deployment, name: site }
        fieldPaths:
          - spec.template.spec.containers.[name=web].image
          - spec.template.spec.containers.[name=web].env.[name=KEYCLOAK_CLIENT_ID].value
          - metadata.labels.app
          - spec.selector.matchLabels.app
          - spec.template.metadata.labels.app
          - metadata.name
      - select: { kind: Service, name: site }
        fieldPaths:
          - metadata.labels.app
          - spec.selector.app
          - metadata.name
      - select: { kind: HTTPRoute, name: site }
        fieldPaths:
          - spec.rules.0.backendRefs.0.name
          - metadata.name
