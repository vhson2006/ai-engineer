# Giặt sấy SFaster: its Keycloak client laundry-web and service account (group /sites/laundry,
# content:read; ADR 0032) and realm site-laundry for its customers (ADR 0049), applied by the Job
# keycloak-config. Its secret: LAUNDRY_WEB_CLIENT_SECRET of the overlay's Secret "keycloak-clients".
# Dev lists only this part (the sites run on the developer's machine).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: keycloak-config
    behavior: merge
    files:
      - site-laundry.json
      - customers-laundry.json # realm site-laundry: its customers (ADR 0049)

# Its customers' sign-in pages are public: /realms/site-laundry on the auth.* route (base/gateway).
patches:
  - target: { kind: HTTPRoute, name: auth }
    patch: |-
      - op: add
        path: /spec/rules/0/matches/-
        value: { path: { type: PathPrefix, value: /realms/site-laundry } }
