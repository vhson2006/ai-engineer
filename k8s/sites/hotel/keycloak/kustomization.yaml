# hotel (sample): its Keycloak client hotel-web and service account (group /sites/hotel,
# content:read; ADR 0032) and realm site-hotel for its customers (ADR 0049), applied by the Job
# keycloak-config. Its secret: HOTEL_WEB_CLIENT_SECRET of the overlay's Secret "keycloak-clients".
# Dev lists only this part (the sites run on the developer's machine).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: keycloak-config
    behavior: merge
    files:
      - site-hotel.json
      - customers-hotel.json # realm site-hotel: its customers (ADR 0049)
