# Envy Nails Spa of Wendell (web/apps/nails-web): the business-site template with this site's names.
# Generated by `npm run sites:generate` from k8s/sites/sites.json: don't edit by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: site
    options:
      annotations:
        config.kubernetes.io/local-config: 'true' # read by the template, never deployed
    literals:
      - APP=nails-web
      - CLIENT_SECRET_KEY=NAILS_WEB_CLIENT_SECRET
      - REALM=site-nails
      - 'REDIS_KEY_PREFIX=nails-web:'

components:
  - ../../_template

# Read by the template; then dropped here, so that several sites can sit in one environment.
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: site
