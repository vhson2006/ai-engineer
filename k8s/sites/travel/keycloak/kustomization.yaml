# Gió Mùa Travel: its Keycloak client travel-web in nest-microservice (service account, group /sites/travel,
# content:read; ADR 0032) and realm site-travel for its customers (ADR 0049), applied by the Job
# keycloak-config. Its secret: TRAVEL_WEB_CLIENT_SECRET of the overlay's Secret "keycloak-clients".
# Dev lists only this part (the sites run on the developer's machine).
# Generated by `npm run sites:generate` from k8s/sites/sites.json: don't edit by hand.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: keycloak-config
    behavior: merge
    files:
      - site-travel.json
      - customers-travel.json

# Its customers' sign-in pages are public: /realms/site-travel on the auth.* route (base/gateway).
patches:
  - target: { kind: HTTPRoute, name: auth }
    patch: |-
      - op: add
        path: /spec/rules/0/matches/-
        value: { path: { type: PathPrefix, value: /realms/site-travel } }
