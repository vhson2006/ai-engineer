# flowers (sample): its Keycloak client flowers-web and service account (group /sites/flowers,
# content:read; ADR 0032) and realm site-flowers for its customers (ADR 0049), applied by the Job
# keycloak-config. Its secret: FLOWERS_WEB_CLIENT_SECRET of the overlay's Secret "keycloak-clients".
# Dev lists only this part (the sites run on the developer's machine).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: keycloak-config
    behavior: merge
    files:
      - site-flowers.json
      - customers-flowers.json # realm site-flowers: its customers (ADR 0049)
