# Khang Hưng Tửu: its Keycloak client wine-web and service account (group /sites/wine, content:read;
# ADR 0032) and realm site-wine for its customers (ADR 0049), applied by the Job keycloak-config.
# Its secret: WINE_WEB_CLIENT_SECRET of the overlay's Secret "keycloak-clients". Dev lists only this
# part (the sites run on the developer's machine).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: keycloak-config
    behavior: merge
    files:
      - site-wine.json
      - customers-wine.json # realm site-wine: its customers (ADR 0049)

# Its customers' sign-in pages are public: /realms/site-wine on the auth.* route (base/gateway).
patches:
  - target: { kind: HTTPRoute, name: auth }
    patch: |-
      - op: add
        path: /spec/rules/0/matches/-
        value: { path: { type: PathPrefix, value: /realms/site-wine } }
