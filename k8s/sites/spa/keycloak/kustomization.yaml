# spa (sample): its Keycloak client spa-web and service account (group /sites/spa, content:read; ADR
# 0032) and realm site-spa for its customers (ADR 0049), applied by the Job keycloak-config. Its
# secret: SPA_WEB_CLIENT_SECRET of the overlay's Secret "keycloak-clients". Dev lists only this part
# (the sites run on the developer's machine).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: keycloak-config
    behavior: merge
    files:
      - site-spa.json
      - customers-spa.json # realm site-spa: its customers (ADR 0049)
