# autoparts (sample): its Keycloak client autoparts-web and service account (group /sites/autoparts,
# content:read; ADR 0032) and realm site-autoparts for its customers (ADR 0049), applied by the Job
# keycloak-config. Its secret: AUTOPARTS_WEB_CLIENT_SECRET of the overlay's Secret "keycloak-
# clients". Dev lists only this part (the sites run on the developer's machine).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: keycloak-config
    behavior: merge
    files:
      - site-autoparts.json
      - customers-autoparts.json # realm site-autoparts: its customers (ADR 0049)

# Its customers' sign-in pages are public: /realms/site-autoparts on the auth.* route (base/gateway).
patches:
  - target: { kind: HTTPRoute, name: auth }
    patch: |-
      - op: add
        path: /spec/rules/0/matches/-
        value: { path: { type: PathPrefix, value: /realms/site-autoparts } }
