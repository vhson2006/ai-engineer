# autoparts (sample) in an environment: list this component in the overlay. It brings the site
# (app/: Deployment, Service, route), its Keycloak client (keycloak/) and writes its public address
# from the overlay's urls.env: AUTOPARTS_HOST (the route) and AUTOPARTS_URL (APP_URL). The overlay also needs
# the image autoparts-web in `images:` and AUTOPARTS_WEB_CLIENT_SECRET in Secret "keycloak-clients".
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - app

components:
  - keycloak

replacements:
  - source: { kind: ConfigMap, name: public-urls, fieldPath: data.AUTOPARTS_HOST }
    targets:
      - select: { kind: HTTPRoute, name: autoparts-web }
        fieldPaths:
          - spec.hostnames.0
  - source: { kind: ConfigMap, name: public-urls, fieldPath: data.AUTH_URL }
    targets:
      - select: { kind: Deployment, name: autoparts-web }
        fieldPaths:
          - spec.template.spec.containers.[name=web].env.[name=KEYCLOAK_ISSUER].value
        options: { delimiter: '/realms/', index: 0 }
  - source: { kind: ConfigMap, name: public-urls, fieldPath: data.AUTOPARTS_URL }
    targets:
      - select: { kind: Deployment, name: autoparts-web }
        fieldPaths:
          - spec.template.spec.containers.[name=web].env.[name=APP_URL].value
