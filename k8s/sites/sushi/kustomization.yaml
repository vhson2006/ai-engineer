# Kumo Sushi & Omakase in an environment: list this component in the overlay. It brings the site (app/:
# Deployment, Service, route), its Keycloak files (keycloak/) and writes its addresses from the
# overlay's urls.env: SUSHI_HOST (the route), SUSHI_URL (APP_URL), AUTH_URL (its customers' realm).
# The overlay also needs what `npm run k8s:check` lists for it (image, client secret, Secret sushi-web).
# Generated by `npm run sites:generate` from k8s/sites/sites.json: don't edit by hand.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - app

components:
  - keycloak

replacements:
  - source: { kind: ConfigMap, name: public-urls, fieldPath: data.SUSHI_HOST }
    targets:
      - select: { kind: HTTPRoute, name: sushi-web }
        fieldPaths:
          - spec.hostnames.0
  - source: { kind: ConfigMap, name: public-urls, fieldPath: data.AUTH_URL }
    targets:
      - select: { kind: Deployment, name: sushi-web }
        fieldPaths:
          - spec.template.spec.containers.[name=web].env.[name=KEYCLOAK_ISSUER].value
        options: { delimiter: '/realms/', index: 0 }
  - source: { kind: ConfigMap, name: public-urls, fieldPath: data.SUSHI_URL }
    targets:
      - select: { kind: Deployment, name: sushi-web }
        fieldPaths:
          - spec.template.spec.containers.[name=web].env.[name=APP_URL].value
