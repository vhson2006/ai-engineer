# Kumo Sushi & Omakase (sample) in an environment: list this component in the overlay. It brings the site
# (app/: Deployment, Service, route), its Keycloak client (keycloak/) and writes its public address
# from the overlay's urls.env: SUSHI_HOST (the route) and SUSHI_URL (APP_URL). The overlay also needs
# the image sushi-web in `images:` and SUSHI_WEB_CLIENT_SECRET in Secret "keycloak-clients".
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - app

components:
  - keycloak

replacements:
  - source: { kind: ConfigMap, name: public-urls, fieldPath: data.SUSHI_HOST }
    targets:
      - select: { kind: HTTPRoute, name: sushi-web }
        fieldPaths:
          - spec.hostnames.0
  - source: { kind: ConfigMap, name: public-urls, fieldPath: data.SUSHI_URL }
    targets:
      - select: { kind: Deployment, name: sushi-web }
        fieldPaths:
          - spec.template.spec.containers.[name=web].env.[name=APP_URL].value
