# Kumo Sushi & Omakase (sample) (web/apps/sushi-web): the business-site template with this site's names.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: site
    options:
      annotations:
        config.kubernetes.io/local-config: 'true' # read by the template, never deployed
    literals:
      - APP=sushi-web
      - CLIENT_SECRET_KEY=SUSHI_WEB_CLIENT_SECRET
      - REALM=site-sushi
      - 'REDIS_KEY_PREFIX=sushi-web:'

components:
  - ../../_template

# Read by the template; then dropped here, so that several sites can sit in one environment.
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: site
