# Kumo Sushi & Omakase: its Keycloak client sushi-web in nest-microservice (service account, group /sites/sushi,
# content:read; ADR 0032) and realm site-sushi for its customers (ADRs 0049, 0050), applied by the
# Job keycloak-config. Its secret: SUSHI_WEB_CLIENT_SECRET of the overlay's Secret "keycloak-clients";
# the realm's e-mail and Google settings: the overlay's Secret "keycloak-customer-auth".
# Dev lists only this part (the sites run on the developer's machine).
# Generated by `npm run sites:generate` from k8s/sites/sites.json: don't edit by hand.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: keycloak-config
    behavior: merge
    files:
      - site-sushi.json
      - customers-sushi.json

# Its customers' sign-in pages are public: /realms/site-sushi on the auth.* route (base/gateway).
patches:
  - target: { kind: HTTPRoute, name: auth }
    patch: |-
      - op: add
        path: /spec/rules/0/matches/-
        value: { path: { type: PathPrefix, value: /realms/site-sushi } }
